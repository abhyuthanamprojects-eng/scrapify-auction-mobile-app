name: scrapify_auction
description: "Scrapify Auction - Industrial scrap bidding platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  dio: ^5.7.0
  intl: any
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  slide_to_act: ^2.0.2
  flutter_slidable: ^3.1.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  equatable: ^2.0.7
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2
  flutter_localizations:
  
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#1e293b"
    theme_color: "#ea580c"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/hero/
    - assets/icons/
  generate: true
